plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version "${shadowJarVersion}"
}

group = groupid
version = ver
description = desc

base {
    archivesName = 'luyten'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven { url "https://peaksuperior885.github.io/peaks_maven/files/" }
}

dependencies {
    implementation "com.apple:AppleJavaExtensions:${appleJavaExtVersion}"
    implementation "info.picocli:picocli:${picocliVersion}"
    implementation "com.github.mstrobel:Procyon.Core:${procyonVersion}"
    implementation "com.github.mstrobel:Procyon.Expressions:${procyonVersion}"
    implementation "com.github.mstrobel:Procyon.Reflection:${procyonVersion}"
    implementation "com.github.mstrobel:Procyon.CompilerTools:${procyonVersion}"
    implementation "com.fifesoft:rsyntaxtextarea:${rsyntaxTextAreaVersion}"
    implementation "com.formdev:flatlaf:${flatlafVersion}"
    implementation "com.miglayout:miglayout-swing:${migver}"
    implementation "org.tinylog:tinylog-api:${tinylogVersion}"
    implementation "org.tinylog:tinylog-impl:${tinylogVersion}"
    implementation "com.formdev:svgSalamander:${svgver}"
    implementation "blue.endless:jankson:${janksonver}"
}

application {
    mainClass = 'com.peak885.luyten.Luyten'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.jar {
    archiveClassifier = 'lib'
}

tasks.named('shadowJar') {
    archiveClassifier = ''

    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Version': project.version,
                'X-Compile-Source-JDK': '1.8',
                'X-Compile-Target-JDK': '1.8'
        )
    }

    exclude 'module-info.class'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('run') {
    workingDir = projectDir
}
