<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>

    <!-- Sugar Cube Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB8C00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Cup Body Gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Cup Inner / Liquid Gradient -->
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2511" />
      <stop offset="100%" stop-color="#2D1508" />
    </linearGradient>

    <!-- Cup Outline/Accent Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Container / App Icon Tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.8" />

  <!-- Shadow Group -->
  <g filter="url(#dropShadow)">
    <!-- Base shadow shapes for depth -->
    <ellipse cx="230" cy="390" rx="130" ry="20" fill="#000000" opacity="0.08" />
    <polygon points="320,380 430,325 350,280 240,335" fill="#000000" opacity="0.06" />
  </g>

  <!-- ================= SUGAR CUBE ================= -->
  <g id="sugar-cube">
    <!-- Outer Glow / Contour -->
    <path d="M 330 150 L 440 205 L 340 370 L 230 315 Z" fill="none" stroke="#FFE082" stroke-width="8" stroke-linejoin="round" opacity="0.5"/>

    <!-- Left Face -->
    <path d="M 235 220 L 335 272 L 335 365 L 235 310 Z" fill="url(#cubeLeft)" />
    
    <!-- Right Face -->
    <path d="M 335 272 L 435 220 L 435 312 L 335 365 Z" fill="url(#cubeRight)" />
    
    <!-- Top Face -->
    <path d="M 335 165 L 435 220 L 335 272 L 235 220 Z" fill="url(#cubeTop)" />

    <!-- Star / Cross Emblem on Top Face -->
    <g stroke="#FFF8E1" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <!-- Main Star Arms -->
      <line x1="335" y1="200" x2="335" y2="236" />
      <line x1="305" y1="218" x2="365" y2="218" />
    </g>
    
    <!-- Subtle Top Face Inner Highlight -->
    <polygon points="335,175 420,220 335,262 250,220" fill="#FFFFFF" opacity="0.15" />
  </g>

  <!-- ================= STEAM LINES ================= -->
  <g id="steam" stroke="url(#steamGrad)" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M 160 150 C 140 120, 180 90, 160 60" />
    <path d="M 210 140 C 190 105, 230 80, 210 50" />
  </g>

  <!-- ================= COFFEE CUP ================= -->
  <g id="coffee-cup" filter="url(#softShadow)">
    
    <!-- Cup Outer Rim / Lip -->
    <ellipse cx="210" cy="230" rx="125" ry="45" fill="url(#strokeGrad)" />
    <ellipse cx="210" cy="230" rx="117" ry="38" fill="#E0F2FE" />
    
    <!-- Inner Liquid / Coffee surface -->
    <ellipse cx="210" cy="233" rx="102" ry="28" fill="url(#coffeeGrad)" />
    <!-- Foam / Liquid Highlight -->
    <path d="M 130 233 A 80 20 0 0 0 270 240 A 75 16 0 0 1 130 233 Z" fill="#D7CCC8" opacity="0.3" />

    <!-- Handle -->
    <path d="M 305 250 C 365 250, 365 330, 285 345" 
          fill="none" 
          stroke="url(#strokeGrad)" 
          stroke-width="26" 
          stroke-linecap="round" />
    <path d="M 305 250 C 355 250, 355 330, 285 345" 
          fill="none" 
          stroke="url(#cupGrad)" 
          stroke-width="14" 
          stroke-linecap="round" />

    <!-- Main Cup Body -->
    <path d="M 90 230
             C 85 320, 125 375, 210 375
             C 295 375, 335 320, 330 230
             Z" 
          fill="url(#cupGrad)" 
          stroke="url(#strokeGrad)" 
          stroke-width="10" 
          stroke-linejoin="round" />

    <!-- Pedestal Base -->
    <path d="M 150 370 
             C 150 390, 270 390, 270 370
             L 260 365
             L 160 365 Z" 
          fill="url(#cupGrad)" 
          stroke="url(#strokeGrad)" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Body Highlight (Curved Gloss) -->
    <path d="M 115 250 
             C 110 300, 135 345, 175 355
             C 150 340, 130 300, 132 250 Z" 
          fill="#FFFFFF" 
          opacity="0.6" />
  </g>
</svg>
